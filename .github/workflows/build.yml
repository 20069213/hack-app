name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Buildozer dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libsqlite3-dev libssl-dev libffi-dev libreadline-dev libbz2-dev

    - name: Install Buildozer
      run: pip install --upgrade buildozer

    - name: Build APK with Buildozer
      run: |
        buildozer init
        # تعديل إعدادات البناء البسيطة تلقائياً لتوافق Tkinter/Python
        sed -i 's/#requirements = python3,kivy/requirements = python3,tkinter/g' buildozer.spec
        sed -i 's/#android.permissions = INTERNET/android.permissions = INTERNET/g' buildozer.spec
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: my-app-apk
        path: bin/*.apk
