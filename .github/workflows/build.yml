name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses-dev libsqlite3-dev libssl-dev libffi-dev libreadline-dev libbz2-dev
        pip install --upgrade buildozer cython

    - name: Build with Buildozer
      run: |
        # شيلنا buildozer init عشان منضيعش الإعدادات بتاعتك
        # شيلنا سطر الـ sed بتاع tkinter عشان ده كان بيكسر البيلد
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: my-app-apk
        path: bin/*.apk
